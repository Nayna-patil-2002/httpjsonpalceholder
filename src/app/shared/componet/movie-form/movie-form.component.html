<form [formGroup]=" movieForm" (ngSubmit)="onMovieform()">
    <div class="form-group">
        <label for="title">Title</label>
        <input class="form-control" formControlName="title" type="text" id="title">
    </div>
    <div class="form-group">
        <label for="title">Image url</label>
        <input class="form-control" formControlName="imgURL" type="text" id="imgURL">
    </div>
    <div class="form-group">
        <label for="description">Description</label>
        <textarea class="form-control" formControlName="description" type="text" id="description"></textarea>
    </div>
    <button mat-raised-button color="primary" *ngIf="!isIneditMode" type="submit" class="mr-3">Add button</button>
    <button mat-raised-button color="primary" *ngIf="isIneditMode" type="button" (click)="onUpdate()" class="mr-3">Update Button</button>
     <button mat-raised-button color="accent"  type="button" (click)="onClose(false)">Close</button>
</form>
