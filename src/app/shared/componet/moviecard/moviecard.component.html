
   
         <mat-card class="mb-4">
            <mat-card-header class="text-center">
                <h1> {{movie.title}}</h1>
                
            </mat-card-header>
            <mat-card-content>
                <div class="row">
                    <div class="col-md-8">
                      <p>{{movie.description}}</p>
                    </div>
                    <div class="col-md-4">
                         <img [src]="movie.imgURL">
                    </div>
                </div>
             
            </mat-card-content>
            <mat-card-actions class="d-flex justify-content-between">
               <button mat-raised-button color="primary" (click)="onEdit()">Edit</button>
               <button mat-raised-button color="warn" (click)="onRemove(movie)">Remove</button>
            </mat-card-actions>
         </mat-card>
