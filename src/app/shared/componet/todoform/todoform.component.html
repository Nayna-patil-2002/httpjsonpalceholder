 <div class="card">
    <div class="card-body">
      <form [formGroup]="todoForm" (ngSubmit)="onTodoAdd()">
    <mat-form-field appearance="fill">
  <mat-label>Title</mat-label>
  <input matInput formControlName="title">
  </mat-form-field>
  <button mat-raised-button color="accent" class="big-btn" type="submit" *ngIf="!isIneditMode">
  Submit
</button>
 <button mat-raised-button color="primary" class="big-btn" (click)="onUpdate()" type="button" *ngIf="isIneditMode">
  Update
</button>
 </form>
    </div>
 </div>
