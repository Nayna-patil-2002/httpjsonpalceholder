  

  <form [formGroup]="postForm" (ngSubmit)="onpostAdd()">
    <div class="form-group">
        <label for="title">Title</label>
        <input class="form-control" id="title" formControlName="title">
    </div>
    <div class="form-group">
        <label for="body">Content</label>
        <input class="form-control" id="body" formControlName="body">
    </div>

    <div class="form-group">
        <label for="body">Content</label>
        <select class="form-control" formControlName="userId">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>

    <button mat-raised-button color="accent" type="submit" *ngIf="!isIneditMode" class="mr-3">Add Post</button>
    <button mat-raised-button color="accent" type="button" *ngIf="isIneditMode" (click)="onUpdate()" class="mr-3">Update Post</button>
    <button mat-raised-button color="warn" type="button" (click)="onClose(false)">
        Close
      </button>
  </form>
