<div class="row">
    <div class="col-md-4 mb-4" *ngFor="let photo of photoArr">
      <mat-card class="mb-3 h-100">
        <mat-card-header>
            <h3>{{photo.title}}</h3>
        </mat-card-header>
        <mat-card-content>
          <p>{{photo.body}}</p>
        </mat-card-content>
        <mat-card-actions class="d-flex justify-content-between">
            <button mat-raised-button color="primary">Edit</button>
            <button mat-raised-button color="warn">Remove</button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
